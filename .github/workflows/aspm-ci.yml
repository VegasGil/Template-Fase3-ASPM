name: ASPM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  aspm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Trivy
        run: |
          wget https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz
          tar zxvf trivy_0.76.0_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/

      # Escaneamos la carpeta sample-app con Trivy
      - name: Run Trivy (generate JSON)
        run: trivy fs --scanners vuln --format json --output trivy_results.json sample-app/package.json || true

      - name: Fetch EPSS & KEV
        run: python aspm/fetch_sources.py
      
      - name: Prioritize Vulnerabilities
        env:
          SPLUNK_HOST: ${{ secrets.SPLUNK_HOST }}
          SPLUNK_TOKEN: ${{ secrets.SPLUNK_TOKEN }}  # Asegúrate de tener este secreto en el repo
        run: python aspm/prioritize.py